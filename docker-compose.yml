version: '3.9'

services:
  # ── Option A: Streamlit (recommended for internal use) ────────────────
  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: se_aries_streamlit
    ports:
      - "8501:8501"
    volumes:
      - aries_data:/data
    environment:
      - SE_ARIES_DB=/data/se_aries.db
    restart: unless-stopped
    networks:
      - aries_net

  # ── Option B: FastAPI backend (REST API) ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: se_aries_backend
    ports:
      - "8000:8000"
    volumes:
      - aries_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/se_aries.db
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    restart: unless-stopped
    networks:
      - aries_net

  # ── Option B: React frontend (for FastAPI backend) ────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: se_aries_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aries_net
    profiles:
      - react

volumes:
  aries_data:

networks:
  aries_net:
    driver: bridge
